name: Credential and launcher tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLAUDE_BACKEND_TEST_BASH: /bin/bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP test dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends curl jq
      - name: Install JSON parser (macOS)
        if: runner.os == 'macOS'
        run: command -v jq >/dev/null || brew install jq
      - name: Install pinned CLIProxyAPI for Go wire contracts
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) go_proxy_platform=linux_amd64; go_proxy_sha=690c512d567d1f250d69b5b16f0447eb92578847474f2d7555b561090dde699c ;;
            Darwin-arm64) go_proxy_platform=darwin_aarch64; go_proxy_sha=a644a75f70cbd045b9f7caa9ff3866353448a7ed67ef8472eacc11c48b1c86f0 ;;
            Darwin-x86_64) go_proxy_platform=darwin_amd64; go_proxy_sha=685d57896b20fad166a57501d419da837b30680d55c4edfa44ba8cd8f2db1d77 ;;
            *) exit 1 ;;
          esac
          go_proxy_archive="$RUNNER_TEMP/go-proxy.tar.gz"
          curl --fail --location --retry 3 --max-time 120 "https://github.com/router-for-me/CLIProxyAPI/releases/download/v7.2.130/CLIProxyAPI_7.2.130_${go_proxy_platform}.tar.gz" -o "$go_proxy_archive"
          python3 - "$go_proxy_archive" "$go_proxy_sha" <<'PY'
          import hashlib, pathlib, sys
          assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == sys.argv[2]
          PY
          mkdir -p "$RUNNER_TEMP/go-proxy-bin"
          tar -xzf "$go_proxy_archive" -C "$RUNNER_TEMP/go-proxy-bin" cli-proxy-api
          mv "$RUNNER_TEMP/go-proxy-bin/cli-proxy-api" "$RUNNER_TEMP/go-proxy-bin/cliproxyapi"
          echo "$RUNNER_TEMP/go-proxy-bin" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s tests -v
      - run: |
          for script in scripts/*.sh scripts/lib/*.sh tests/*.sh ask-backend claudex go-claude mimo-claude deepseek-claude glm-claude; do /bin/bash -n "$script" || exit; done
  linux-stores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pass gnupg dbus gnome-keyring libsecret-tools
      - run: bash tests/linux-stores.sh
